name: Build profile README

on:
  push:
    paths:
      - "profile.yml"
      - "scripts/build_readme.py"
      - ".github/workflows/readme.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * *"   # daily 21:17 UTC = 05:17 北京，避开 0 点拥挤段

permissions:
  contents: write

concurrency:
  group: readme-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Rebuild README from profile.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_readme.py

      - name: Commit rebuilt README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README.md is already up to date"
          else
            git commit -m "docs: rebuild README from profile.yml"
            git push
          fi
