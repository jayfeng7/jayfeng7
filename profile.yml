# 注意：部分品牌的 logo 已从 simple-icons 下架（如 OpenAI / LinkedIn），会自动降级为纯文字徽章
badge_groups:
  - title: "AI & Agents"
    badges:
      - label: OpenAI
        color: "412991"
      - label: LangChain
        color: "1C3C3C"
        logo: langchain
      - label: Hugging Face
        color: "FFD21E"
        logo: huggingface
        logo_color: black
  - title: "ML & Data"
    badges:
      - label: scikit-learn
        color: "F7931E"
        logo: scikitlearn
      - label: pandas
        color: "150458"
        logo: pandas
      - label: numpy
        color: "013243"
        logo: numpy
  - title: "Security"
    badges:
      - label: Wireshark
        color: "1679A7"
        logo: wireshark
      - label: Metasploit
        color: "2596CD"
        logo: metasploit

# ---------- 联系方式 / 社交链接 ----------
# 留空 "" 的项不显示；填了就会公开展示在主页，请自行斟酌隐私
social:
  email: ""           # 邮箱，例如 you@example.com（会公开，易被爬虫收集，谨慎填写）
  blog: ""            # 博客 / 个人网站，例如 https://yourblog.dev
  twitter: ""         # X（Twitter）用户名
  linkedin: ""        # LinkedIn 用户名
  bilibili: ""        # B 站 UID（space.bilibili.com/ 后面的纯数字）
  zhihu: ""           # 知乎 ID（www.zhihu.com/people/ 后面那串）

# ---------- 统计区开关与主题 ----------
stats:
  theme: tokyonight       # 卡片主题：tokyonight / radical / gruvbox / dracula / onedark / transparent ...
  show_visitors: true     # 访问量徽章
  show_streak: true       # 连续提交卡片
  show_trophy: false      # 成就奖杯墙（现在仓库少，多为灰色 SECRET；活跃后可改成 true）
  show_snake: true        # 贡献贪吃蛇动画
